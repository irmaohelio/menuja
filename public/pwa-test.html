<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teste de instalação</title>
  <link rel="manifest" href="/pwa-test-manifest.json" />
  <meta name="theme-color" content="#e11d48" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    #status { font-size: 20px; font-weight: bold; margin: 16px 0; }
    button { padding: 12px 20px; font-size: 16px; border-radius: 10px; border: 0; background: #e11d48; color: #fff; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Diagnóstico de instalação</h1>
  <p id="status">Verificando...</p>
  <button id="btn" disabled>Instalar</button>
  <p id="info" style="color:#6b7280;font-size:13px;margin-top:20px"></p>
  <script>
    var info = document.getElementById('info')
    info.textContent = 'UA: ' + navigator.userAgent

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault()
      window.__p = e
      document.getElementById('status').textContent = 'CONVITE DISPAROU ✔ (instalável)'
      var b = document.getElementById('btn')
      b.disabled = false
      b.onclick = function () { e.prompt() }
    })

    window.addEventListener('appinstalled', function () {
      document.getElementById('status').textContent = 'INSTALADO ✔'
    })

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function () {
        info.textContent += ' | SW ok'
      }).catch(function () {
        info.textContent += ' | SW FALHOU'
      })
    } else {
      info.textContent += ' | sem serviceWorker'
    }
    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      document.getElementById('status').textContent = 'JÁ ESTÁ ABERTO COMO APP (standalone)'
    } else {
      setTimeout(function () {
        if (!window.__p) {
          document.getElementById('status').textContent = 'CONVITE NÃO DISPAROU ✖'
        }
      }, 9000)
    }
  </script>
</body>
</html>
